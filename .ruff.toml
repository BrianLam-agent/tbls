# Ruff configuration for the `tbls` package + `experiments/` scripts + tests.
#
# Source layout: `src/tbls/` (the published package), `experiments/` (training
# CLI, not published), `tests/` (pytest suite). See docs/architecture.md.
src = ["src", "experiments", "tests"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "site-packages",
    "venv",
    # Untracked, non-project scratch/backup files kept in the working tree for
    # reference (not part of the `tbls` package, never committed): a legacy
    # code snapshot and a pasted comparison file. Remove these entries if the
    # files are removed.
    "BLS",
    "gfcca.py",
]

force-exclude = true

line-length = 100
indent-width = 4
target-version = "py310"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "D",     # pydocstyle (Google-style docstrings; see docs/development.md)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear (common bugs)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PLE",   # pylint errors
    "RUF",   # Ruff-specific rules
]

ignore = [
    "E501",    # line length handled by formatter; long lines in docstrings/URLs ok
    "D100",    # missing docstring in public module (not required at module level)
    "D104",    # missing docstring in public package (__init__.py can be terse)
    "D107",    # missing docstring in __init__: google convention documents it in the class docstring
    "D203",    # conflicts with D211 (no-blank-line-before-class)
    "D213",    # conflicts with D212 (multi-line-summary-first-line)
    "PLR0913", # too many arguments (ML estimators legitimately have many hyperparameters)
    "PLR2004", # magic value comparison
    "N803",    # argument name should be lowercase (X, Y are sklearn/math convention)
    "N806",    # variable in function should be lowercase (X, Y, K matrices)
    "RUF002",  # Chinese punctuation in docstrings (bilingual comments allowed)
    "RUF003",  # Chinese punctuation in comments
]

[lint.per-file-ignores]
# Tests: docstrings optional, asserts expected, fixtures may shadow names.
"tests/**" = ["D", "ARG001", "ARG002"]
# CLI: typer options accessed via signature defaults, not always "used" directly.
"experiments/**" = ["D", "ARG001"]
# Legacy comparison-algorithm factory migrated verbatim from othercode/ (not part
# of the published package). These rules flag external-interface conformations
# that must not be changed in working legacy code: sklearn get_params `deep`
# (ARG002), PyTorch `import ... as F` (N812), public class names (N801),
# availability-check imports after try/except (E402, F401). All other
# (mechanical) violations are fixed.
"experiments/classifiers.py" = ["ARG002", "N801", "N812", "E402", "F401"]

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["tbls"]

[lint.pydocstyle]
convention = "google"

[lint.pylint]
max-args = 8
max-locals = 20
max-branches = 15

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88
